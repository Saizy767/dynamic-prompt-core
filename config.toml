# Configuration for the LLM server launcher and asyncTask.py client.
# Both read this same [llm] section. The launcher uses the keys below to
# start llama-server (or vllm); asyncTask.py reads model_path and
# served_model_name to connect and send requests.

[llm]
# Backend to launch: "llamacpp" (llama-server) or "vllm".
# vllm refuses to run on macOS (darwin) with a clear message; it is a
# Linux GPU target.
backend = "llamacpp"

# Path to the model directory or Hugging Face repo id. asyncTask.py loads the
# tokenizer from here (AutoTokenizer.from_pretrained). vLLM serves from here.
model_path = "model"

# Path to the GGUF file, used only by the llamacpp backend (llama-server -m).
# Launcher-only key; asyncTask.py ignores it.
gguf_path = "model/qwen2.5-3b-instruct-q4_k_m.gguf"

# Name the server presents via GET /v1/models and that asyncTask.py sends as
# the "model" field in chat payloads. For llamacpp the launcher passes this as
# --alias so the server reports it. These two MUST match or the server rejects
# requests with a model-name mismatch.
served_model_name = "qwen2.5-3b-instruct"

# Network address the server binds.
host = "127.0.0.1"
port = 8080

# Inference parameters passed to the backend.
ctx_size = 4096      # llamacpp: -c (context window); vllm: --max-model-len
gpu_layers = -1       # llamacpp: -ngl (layers in VRAM; 0 = CPU-only, -1 = all)
threads = 2          # llamacpp: -t (CPU threads); vllm: ignored

# Seconds to wait for GET /v1/models to return 200 before giving up.
# llama-server is fast (~10s); vllm model load can take minutes.
startup_timeout = 60

# Scorer backend selection for candidate-scoring classification.
# The baseline runner and optimization cycle build the classifier from
# this section. llama_server is the only scoring backend: it scores each
# candidate token by forcing generation via logit_bias on the running
# llama-server (/v1/completions) and reading the token's true
# full-vocabulary log-prob (validated on llama.cpp 0.5.0). No in-process
# model is loaded for classification.
[model]
backend = "llama_server"

# llama_server backend parameters.
# endpoint must match the running llama-server ([llm] host:port by default).
[model.llama_server]
endpoint = "http://127.0.0.1:8080"
timeout = 30

# Dataset configuration for dataset.py (loader, split, artifact persistence).
# asyncTask.py ignores this section; it only reads [llm].
[dataset]
# Path to the source dataset in jsonl or parquet format.
# Use convert_csv_to_jsonl.py to produce this from data/train.csv.
path = "data/train.jsonl"
# Fixed seed for the reproducible dev/holdout split.
seed = 42
# Fraction of non-ambiguous records held out (holdout). Must be strictly
# between 0 and 1.
holdout_ratio = 0.2

# Classification candidate configuration.
# The candidate set used by the baseline runner for candidate-scoring
# classification. Each value becomes a Candidate for scoring and policy.
[classification]
candidates = ["0", "1"]

# Stage 1 baseline runner configuration (runner.py).
# asyncTask.py and dataset.py ignore this section.
[runner]
# Max concurrent in-flight model requests. Conservative for CPU llama-server.
concurrency = 2
# fsync the checkpoint every N examples (1 = maximum durability).
checkpoint_interval = 1
# Directory for results artifacts and request logs.
output_dir = "data/results"
# Normalization language: "ru" (pymorphy3) or "en" (spaCy).
language = "ru"
# Classification prompt version to use (must match a PromptArtifact version).
prompt_version = "classify-v0"
# Path to the prepared dataset artifact (from dataset-and-prompt).
dataset_artifact = "data/prepared_42_20261002T092615Z.jsonl"

# Stage 1 metrics configuration (metrics.py).
# runner.py, asyncTask.py, and dataset.py ignore this section.
[metrics]
# Flag a prediction-distribution bias when the gap between predicted and true
# class shares exceeds this threshold (fraction).
bias_threshold = 0.15
# Text-length group boundaries (word count): short < group_short_max,
# medium group_short_max..group_long_min, long > group_long_min.
group_short_max = 10
group_long_min = 30
# Directory for metrics artifacts.
output_dir = "data/results"
# When true, metric results are also appended as JSONL to
# {output_dir}/metrics/metrics.log on every compute_metrics call.
log_to_file = true

# Stage 1 thesis analyzer configuration (thesis_analyzer.py).
# runner.py, asyncTask.py, dataset.py, and metrics.py ignore this section.
[thesis_analyzer]
# Embedding model for semantic clustering of normalized theses.
# sentence-transformers model name; downloaded from Hugging Face on first use.
embedding_model = "paraphrase-multilingual-MiniLM-L12-v2"
# Cosine similarity thresholds for cluster assignment.
# Below cosine_lower: not attached by cosine. Above cosine_upper: attached
# directly. Between (grey zone): resolved by Manhattan distance.
cosine_lower = 0.60
cosine_upper = 0.75
# Manhattan distance threshold for grey-zone resolution (L1 distance on
# 384-dim embeddings). Tune after inspecting the first dump.
manhattan_threshold = 8.0
# Maximum number of clusters. When reached, unmatched theses are force-assigned
# to the nearest cluster. 20 is suitable for datasets with <200 examples.
max_clusters = 20
# Embedding device: "auto" (detect MPS/CUDA/CPU), "mps", "cuda", or "cpu".
embedding_device = "auto"
# Batch size for the batch-encode call when computing all thesis embeddings.
embedding_batch_size = 32
# Directory for thesis bank dump artifacts.
output_dir = "data/results"

# Stage 2 rule candidate selector configuration (rule_candidate_selector.py).
# thesis_analyzer.py and earlier stages ignore this section.
[rule_candidate_selector]
# Minimum cluster frequency to be considered a rule candidate. Clusters with
# frequency below this threshold are excluded. 3 suits datasets with <200
# examples; lower to 2 if borderline clusters are being dropped.
frequency_threshold = 3
# Number of candidate clusters to select after filtering and ranking. The
# rule-formulation stage consumes these top-N candidates.
top_n = 5
# Maximum number of representative theses to attach per candidate cluster,
# chosen by descending thesis frequency.
max_representative_theses = 3
# Directory for rule candidate artifacts.
output_dir = "data/results"

# Stage 3 prompt composer configuration (prompt_composer.py).
# rule_candidate_selector.py and earlier stages ignore this section.
[prompt_composer]
# Maximum number of rules allowed in the assembled prompt version.
max_rules = 5
# Maximum total prompt tokens (system prompt only). The token count uses the
# AsyncTask tokenizer; falls back to word count when unavailable. The base
# layers alone are ~155 tokens, so 300 leaves headroom for up to 5 rules.
max_prompt_tokens = 600
# Maximum number of words per formulated rule. Longer rules are truncated.
max_rule_words = 20
# Cosine similarity threshold for the distortion check. Rules whose embedding
# vs. the source cluster centroid falls below this are rejected (or
# reformulated once when allow_reformulation is true).
distortion_threshold = 0.5
# When true, a rule failing the distortion check gets one reformulation
# attempt before rejection.
allow_reformulation = true
# Embedding model for the distortion check. Reuses the sentence-transformers
# model from thesis_analyzer.py by default.
embedding_model = "paraphrase-multilingual-MiniLM-L12-v2"
# Embedding device for the distortion check: "auto", "mps", "cuda", or "cpu".
embedding_device = "auto"
# Max tokens for the LLM formulation call.
formulation_max_tokens = 64
# Temperature for the LLM formulation call (0 = deterministic).
formulation_temperature = 0.0
# Directory for prompt version artifacts.
output_dir = "data/results"

# Version-comparator configuration (application/use_cases/compare_versions).
# Only the cycle's accept/rollback decision reads this section.
[version_comparator]
# Primary metric for the accept/rollback decision on holdout. The new version
# is accepted when its value is strictly greater than the active's; on a tie,
# the tie-breaker metric below decides.
# Options: macro_f1, accuracy.
decision_metric = "macro_f1"
# Tie-breaker metric: on a primary-metric tie, accept only if this strictly
# improves, otherwise roll back.
# Options: minority_f1, accuracy.
tie_breaker_metric = "minority_f1"

# Stage 3 cycle orchestrator configuration (cycle_orchestrator.py).
# This is the top-level entry point that drives the full optimization loop.
# All earlier stage components are called via their public APIs.
[cycle_orchestrator]
# Maximum number of cycles to run. Each cycle runs the active prompt on dev,
# computes metrics, updates the thesis bank, selects candidates, composes a new
# version, runs it on holdout, and decides accept/rollback. The cycle stops when
# the cycle counter reaches this limit.
max_cycles = 20
# Number of dataset rows to process per round.
#   0  — process all rows in the split (default).
#   N  — process N rows in every round.
#   [N1, N2, ...] — run len(list) rounds (overrides max_rounds), round i
#                   processes list[i] rows.
duration = 50
# Dataset splits to use for the active and holdout runs. The dev split drives
# the accept/rollback decision; the holdout split is logged only.
dev_split = "dev"
holdout_split = "holdout"
# Start the cycle from a specific prompt: "best" or "0".
# "best": load the newest prompt_v*_*_*.json from <output_dir>/prompt/.
#         If the directory is empty, falls back to v0.
# "0":   start from the built-in CLASSIFICATION_PROMPT_V0 baseline (default).
prompt_start = "0"
# When true, the full cycle state is dumped to a JSON file after each cycle,
# enabling resume from the last completed cycle.
dump_state_after_each_cycle = true
# Directory for cycle artifacts (reports, summaries, state dumps, cycle log).
output_dir = "data/results"
# When true, run stage4-teacher-refinement between the baseline run and thesis
# analysis each round. Requires [teacher].endpoint to be configured.
use_teacher_refinement = false

# Stage 3 prompt version store configuration (prompt_store.py).
# This is the single source of truth for prompt version lifecycle: persisting
# versions, tracking the active version, archiving displaced versions, and
# reconstructing version lineage. The composer, comparator, and orchestrator
# read from and write to this store.
[prompt_store]
# Path to the store JSON file. All version records are kept in this one file.
# Required: the store will not initialize without a path.
store_path = "data/prompt_store.json"
# When true, the store file is written atomically (write-to-temp then rename)
# to prevent corruption on crash. Set to false only for debugging.
atomic_writes = true
# Path to the append-only operation log (JSONL). Each store operation appends
# one line with timestamp, operation, version, and details.
log_path = "data/prompt_store.jsonl"

# Stage 3 cycle observer configuration (cycle_observer.py).
# This is a read-only component that loads the artifacts produced by a completed
# cycle and renders a human- or machine-readable review. It mutates no cycle
# state; it only reads artifacts and writes its own report + log.
[cycle_observer]
# Output format: "markdown" (human-readable, README/issue-ready) or "json"
# (machine-readable).
output_format = "markdown"
# Path where the observer report is written. Overridable via the --output flag.
output_path = "observer_report.md"
# Maximum number of characters of example text to include in the changed-
# decisions section. Longer text is truncated with an ellipsis.
max_example_text_length = 100
# Number of clusters to include in the thesis-store top-N summary, ranked by
# frequency.
top_clusters_count = 10
# When true, holdout metrics are included in the metric-trends section. When
# false, holdout columns are omitted.
include_holdout = true
# Directory where cycle artifacts are discovered and the observer log is written.
output_dir = "data/results"

# Stage 4 teacher refinement configuration (thesis_refiner.py).
# This component refines Tiny-model thesis candidates using a larger teacher
# model over a separate endpoint. It filters noisy/interpretive theses,
# reformulates unstable phrasings, adds missed theses, and writes a reloadable
# theses_refined_*.jsonl artifact. runner.py and earlier stages ignore this
# section.
[teacher]
# Endpoint for the teacher model (OpenAI-compatible /v1). Required: the
# refiner will not initialize without it. Must be distinct from [llm].
endpoint = "http://127.0.0.1:8081/v1"
# Model name the teacher server presents (sent as the "model" field). Required.
model_name = "qwen2.5-7b-instruct"
# Path to the teacher model's tokenizer (AutoTokenizer.from_pretrained). Used
# for input truncation. When empty, falls back to [llm].model_path — correct
# only when both models share a tokenizer.
model_path = ""
# Sampling temperature for teacher calls (0 = deterministic).
temperature = 0.0
# Max tokens for the teacher response (the RefinementPlan JSON).
max_tokens = 512
# Seconds to wait for a single teacher call before timing out.
timeout = 60
# Max retry attempts for retryable teacher errors (network, 5xx).
max_retries = 10
# When true, downstream stages use theses_refined when the artifact exists;
# when false, they fall back to theses_raw_tiny.
use_refined = true
# When true, the teacher filters noisy (generic, uninformative) theses.
filter_noisy = true
# When true, the teacher filters or reformulates interpretive theses into
# extractive form.
filter_interpretive = true
# When true, the teacher may add theses the Tiny model missed (tagged
# source=teacher). When false, only filtering and reformulation are done.
allow_additions = true
# Max concurrent in-flight teacher requests (semaphore in the refiner).
# Conservative for CPU llama-server, mirrors [runner].concurrency.
concurrency = 2
# Directory for the refined theses artifact.
output_dir = "data/results"
# Path to the append-only refinement log (JSONL). Each operation appends one
# line with timestamp, operation, example id, and details.
log_path = "data/thesis_refiner.jsonl"
