[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-prompt-core"
version = "0.1.0"
description = "Iterative system-prompt optimization for small LLM classifiers"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "transformers>=4.40",
    "numpy>=1.26",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "sentence-transformers>=2.7",
    "pymorphy3>=2.0",
    "spacy>=3.7",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
#  import-linter — architectural boundary enforcement
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_packages = ["dynamic_prompt_core"]

[[tool.importlinter.contracts]]
name = "layer-direction"
type = "layers"
layers = [
    "dynamic_prompt_core.interfaces",
    "dynamic_prompt_core.application",
    "dynamic_prompt_core.infrastructure",
    "dynamic_prompt_core.domain",
]

[[tool.importlinter.contracts]]
name = "domain-isolated"
type = "forbidden"
source_modules = ["dynamic_prompt_core.domain"]
forbidden_modules = [
    "dynamic_prompt_core.application",
    "dynamic_prompt_core.infrastructure",
    "dynamic_prompt_core.interfaces",
]

[[tool.importlinter.contracts]]
name = "application-isolated"
type = "forbidden"
source_modules = ["dynamic_prompt_core.application"]
forbidden_modules = [
    "dynamic_prompt_core.interfaces",
]

[[tool.importlinter.contracts]]
name = "infrastructure-isolated"
type = "forbidden"
source_modules = ["dynamic_prompt_core.infrastructure"]
forbidden_modules = [
    "dynamic_prompt_core.application.use_cases",
    "dynamic_prompt_core.interfaces",
]

[[tool.importlinter.contracts]]
name = "no-cyclic-imports"
type = "acyclic_siblings"
ancestors = ["dynamic_prompt_core"]

# --------------------------------------------------------------------------- #
#  mypy — static type checking
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dynamic_prompt_core"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymorphy3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "spacy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
#  ruff — linting and formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B023"]

[tool.ruff.lint.isort]
known-first-party = ["dynamic_prompt_core"]

# --------------------------------------------------------------------------- #
#  pytest — test runner
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
