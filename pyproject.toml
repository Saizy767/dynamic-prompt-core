[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-prompt-core"
version = "0.1.0"
description = "Iterative system-prompt optimization for small LLM classifiers"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "transformers>=4.40",
    "numpy>=1.26",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "sentence-transformers>=2.7",
    "pymorphy3>=2.0",
    "spacy>=3.7",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
gguf = [
    "llama-cpp-python>=0.3.0,<0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
#  import-linter — architectural boundary enforcement
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_packages = ["dynamic_prompt_core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain-isolated"
type = "forbidden"
source_modules = ["dynamic_prompt_core.domain"]
forbidden_modules = [
    "dynamic_prompt_core.application",
    "dynamic_prompt_core.infrastructure",
    "dynamic_prompt_core.interfaces",
]

# domain stdlib-only allowlist: domain may import only the standard library
# plus an explicit allowlist (currently empty). Any third-party import not on
# the allowlist is a violation. This is forward-compatible — new LLM libraries
# are automatically forbidden without adding them to a blacklist.
[[tool.importlinter.contracts]]
name = "domain-stdlib-only-allowlist"
type = "forbidden"
source_modules = ["dynamic_prompt_core.domain"]
forbidden_modules = [
    "transformers",
    "aiohttp",
    "torch",
    "sentence_transformers",
    "pydantic",
    "numpy",
    "sklearn",
    "pymorphy3",
    "spacy",
    "pyarrow",
    "tqdm",
]

[[tool.importlinter.contracts]]
name = "application-isolated"
type = "forbidden"
source_modules = ["dynamic_prompt_core.application"]
forbidden_modules = [
    "dynamic_prompt_core.interfaces",
]

# application ports must not depend on infrastructure or interfaces, directly
# or indirectly. This is the dependency-inversion boundary: ports remain pure
# abstractions that infrastructure implements, not the other way around.
[[tool.importlinter.contracts]]
name = "application-ports-isolated"
type = "forbidden"
source_modules = ["dynamic_prompt_core.application.ports"]
forbidden_modules = [
    "dynamic_prompt_core.infrastructure",
    "dynamic_prompt_core.interfaces",
]

[[tool.importlinter.contracts]]
name = "infrastructure-isolated"
type = "forbidden"
source_modules = ["dynamic_prompt_core.infrastructure"]
forbidden_modules = [
    "dynamic_prompt_core.application.use_cases",
    "dynamic_prompt_core.interfaces",
]

[[tool.importlinter.contracts]]
name = "no-cyclic-imports"
type = "acyclic_siblings"
ancestors = ["dynamic_prompt_core"]

# --------------------------------------------------------------------------- #
#  mypy — static type checking
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dynamic_prompt_core"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymorphy3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "spacy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llama_cpp.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
#  ruff — linting and formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B023"]

[tool.ruff.lint.isort]
known-first-party = ["dynamic_prompt_core"]

# --------------------------------------------------------------------------- #
#  pytest — test runner
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "gguf: requires the optional llama-cpp-python runtime and a GGUF test fixture",
]
